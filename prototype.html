const creators=[{id:'zuri',name:'Zuri Bennett',role:'Author · Fantasy & Romance',badge:'Platinum Quill',followers:'24.8K',works:'12',bio:'I write worlds where Black girls get to be magical, complicated, and the heroes of their own stories.',tags:['Afrofantasy','Romance','Worldbuilding'],stats:['24.8K followers','12 stories','1.2M reads']},{id:'naya',name:'Naya Rivers',role:'Voice Actor · Storyteller',badge:'Voice Maven',followers:'18.2K',works:'8',bio:'Giving unforgettable characters the voices they deserve. Audiobook narrator, dreamer, and voice-world builder.',tags:['Narration','Audiobooks','Drama'],stats:['18.2K followers','8 narrations','640K listens']},{id:'eli',name:'Eli Mercer',role:'Author & Voice Artist',badge:'Story Shaper',followers:'9.4K',works:'5',bio:'Sci-fi with heart. I write about tomorrow, the people who shape it, and the voices we leave behind.',tags:['Sci-fi','Audio Fiction','Indie Author'],stats:['9.4K followers','5 stories','280K reads']}];
const stories=[{id:'night',title:'The Night Between Stars',author:'Zuri Bennett',creator:'zuri',genre:'Fantasy',category:'Fantasy',length:'12 chapters',rating:'4.9',cover:'night',desc:'When the stars begin disappearing, an unlikely archivist discovers a secret written in the spaces between them.',chapter:'The sky had always spoken to Amara. Tonight, for the first time, it went silent. Across the rooftops, the last constellation flickered like a candle in the wind. She pressed her palm to the window and felt the quiet settle over the city. Somewhere beyond the midnight haze, a door was opening—one that had been waiting for her name.'},{id:'velvet',title:'Velvet & Vows',author:'Naya Rivers',creator:'naya',genre:'Romance',category:'Romance',length:'18 chapters',rating:'4.8',cover:'velvet',desc:'One impossible promise. Two hearts that refuse to follow the rules.',chapter:'The invitation arrived on a Tuesday, sealed in wine-red wax. Simone knew better than to open letters written in gold ink. She opened it anyway. There were only seven words inside, but they rearranged everything she thought she knew about love.'},{id:'echoes',title:'Echoes of Tomorrow',author:'Eli Mercer',creator:'eli',genre:'Sci-fi',category:'Sci-fi',length:'9 chapters',rating:'4.9',cover:'echoes',desc:'A sound engineer hears messages from a future that has not yet happened.',chapter:'At 2:17 a.m., the recording played a voice Eli had never heard before. It was his own—older, frightened, and begging him not to press rewind. The waveforms stretched across the console like a warning. He reached for the headphones.'},{id:'lantern',title:'The Lantern House',author:'Zuri Bennett',creator:'zuri',genre:'Mystery',category:'Mystery',length:'14 chapters',rating:'4.7',cover:'lantern',desc:'Every night, the abandoned house lights one more window.',chapter:'At the edge of Bellwether Road stood a house nobody claimed. By winter, there were seven lights in its windows. By spring, there were eight. Mara counted them every evening and wondered who was counting her.'},{id:'letters',title:'Letters to the Sun',author:'Naya Rivers',creator:'naya',genre:'Poetry',category:'Poetry',length:'21 pieces',rating:'4.8',cover:'letters',desc:'An intimate collection of love letters, loss, and finding your way home.',chapter:'Dear Sun, I am learning to be warm without burning. I am learning that softness is not surrender. I am learning to greet the morning with my whole name.'},{id:'rhythm',title:'Rhythm of Us',author:'Eli Mercer',creator:'eli',genre:'Drama',category:'Drama',length:'11 chapters',rating:'4.6',cover:'rhythm',desc:'An underground music collective discovers what family really means.',chapter:'The bass reverberated through the little venue until it seemed the walls had a heartbeat. Nobody came to the basement for perfection. They came because they were finally allowed to be loud.'}];

function restoreDemo(){try{const savedData=JSON.parse(localStorage.getItem(storageKey)||'null');if(!savedData||typeof savedData!=='object')return;const allowedIds=new Set(stories.map(s=>s.id));if(Array.isArray(savedData.saved))state.saved=new Set(savedData.saved.filter(v=>allowedIds.has(v)));if(Array.isArray(savedData.following))state.following=new Set(savedData.following.filter(v=>creators.some(c=>c.id===v)));if(Array.isArray(savedData.reactions))state.reactions=new Set(savedData.reactions);if(savedData.shelfById&&typeof savedData.shelfById==='object')for(const [id,label] of Object.entries(savedData.shelfById))if(allowedIds.has(id)&&shelves.includes(label))state.shelfById[id]=label;
for(const key of ['userName','userHandle','userBio','userAvatar','userAccent','favoriteGenre'])if(typeof savedData[key]==='string')state[key]=savedData[key].slice(0,key==='userBio'?180:48);
if(!profilePortraits.includes(state.userAvatar))state.userAvatar='me';if(!['plum','rose','moon'].includes(state.userAccent))state.userAccent='plum';if(!Array.isArray(savedData.published))return;state.published=savedData.published.filter(d=>typeof d.title==='string'&&typeof d.body==='string').slice(0,30).map(d=>({title:d.title.slice(0,70),body:d.body.slice(0,2000)}));if(Array.isArray(savedData.studioChecklist))state.studioChecklist=[0,1,2].map(i=>!!savedData.studioChecklist[i]);if(typeof savedData.dark==='boolean')state.dark=savedData.dark;
}catch(e){}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({saved:[...state.saved],following:[...state.following],reactions:[...state.reactions],shelfById:state.shelfById,userName:state.userName,userHandle:state.userHandle,userBio:state.userBio,userAvatar:state.userAvatar,userAccent:state.userAccent,favoriteGenre:state.favoriteGenre,published:state.published,studioChecklist:state.studioChecklist,dark:state.dark}))}catch(e){}}

function loadCommunity(){try{const x=JSON.parse(localStorage.getItem(communityStore)||'null');if(!x||typeof x!=='object')return;if(Number.isSafeInteger(x.coins)&&x.coins>=0&&x.coins<=50000)state.coins=x.coins;if(typeof x.checkinDay==='string')state.checkinDay=x.checkinDay.slice(0,12);if(Array.isArray(x.joinedClubs))state.joinedClubs=new Set(x.joinedClubs.filter(id=>clubs.some(c=>c.id===id)));if(Array.isArray(x.posts))state.posts=x.posts.filter(p=>p&&typeof p.text==='string'&&clubs.some(c=>c.id===p.club)).slice(0,40).map(p=>({id:String(p.id).slice(0,45),club:p.club,text:p.text.slice(0,360),spoiler:!!p.spoiler,author:state.userName,time:'Your post',likes:0}));if(Array.isArray(x.postLikes))state.postLikes=new Set(x.postLikes.filter(v=>typeof v==='string').slice(0,200));if(Array.isArray(x.spoilersShown))state.spoilersShown=new Set(x.spoilersShown.filter(v=>typeof v==='string'));if(['parchment','moonlight','ink'].includes(x.readTheme))state.readTheme=x.readTheme;if(x.highlights&&typeof x.highlights==='object')state.highlights=x.highlights;if(x.readingProgress&&typeof x.readingProgress==='object')state.readingProgress=x.readingProgress;if(Array.isArray(x.unlocked))state.unlocked=new Set(x.unlocked.filter(v=>v==='night'));if(Array.isArray(x.castingRequests))state.castingRequests=x.castingRequests.filter(v=>v&&typeof v.note==='string').slice(0,12).map(v=>({narrator:v.narrator,work:String(v.work).slice(0,75),note:v.note.slice(0,300)}));}catch(e){}}
function saveCommunity(){try{localStorage.setItem(communityStore,JSON.stringify({coins:state.coins,checkinDay:state.checkinDay,joinedClubs:[...state.joinedClubs],posts:state.posts,postLikes:[...state.postLikes],spoilersShown:[...state.spoilersShown],readTheme:state.readTheme,highlights:state.highlights,readingProgress:state.readingProgress,unlocked:[...state.unlocked],castingRequests:state.castingRequests}))}catch(e){}}
function todayLocal(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function creatorCard(c){return `<div class="creator-card"><button style="border:0;background:none;padding:0" data-action="creator" data-id="${c.id}" aria-label="Open ${c.name} profile">${avatar(c.id)}</button><button class="creator-info" data-action="creator" data-id="${c.id}" style="border:0;background:none;text-align:left;padding:0;color:var(--text)"><strong>${c.name}</strong><span>${c.role}</span><span class="mini-badge">${icon('award',11)} ${c.badge}</span></button><button class="follow-btn ${state.following.has(c.id)?'following':''}" data-action="follow" data-id="${c.id}">${state.following.has(c.id)?'Following':'+ Follow'}</button></div>`}
function badge(t,i){return `<button class="tier" data-action="badge" data-id="${i}"><span class="medal ${t.type}">${t.symbol}</span><strong>${t.name}</strong><small>${t.subtitle}</small></button>`}

const learningUnits=[
{id:'harlem',topic:'Black History',art:'harlem',glyph:'♫',title:'The Harlem Renaissance',subtitle:'When art helped rewrite the conversation',duration:'4 min',level:'Curious beginner',host:'The AseVerse Learning Collective',intro:'Picture Harlem, New York, in the 1920s: poetry, music, debate, and visual art were reshaping how Black Americans expressed identity and possibility.',body:['The Harlem Renaissance was a flourishing of African American cultural creativity during the 1920s and into the 1930s. Harlem was a well-known center, but the movement reached audiences and artists far beyond one neighborhood.','Writers such as Langston Hughes and Zora Neale Hurston explored Black life in varied, sometimes challenging ways. Musicians, painters, performers, editors, and community institutions also shaped the era.','It was more than entertainment. Artists explored pride, everyday experience, racial injustice, beauty, and freedom. Different creators did not always agree about what Black art should say—and that debate was part of the movement.'],points:['Harlem was a major center, not the movement’s only home.','Poetry, jazz, novels, and visual arts all mattered.','The artists expressed many different perspectives on Black identity.'],quiz:[{q:'Which period is most associated with the Harlem Renaissance?',opts:['The 1920s and 1930s','The 1700s','The 1990s'],right:0,why:'The movement is especially associated with the 1920s and extended into the 1930s.'},{q:'Which creative field was part of the movement?',opts:['Only painting','Writing, music, and visual arts','Only film'],right:1,why:'The movement spanned many kinds of artistic and intellectual expression.'},{q:'What is an important takeaway?',opts:['Every artist held the same opinion','Harlem was the only place creating Black art','Artists offered diverse views of Black life'],right:2,why:'One of its strengths was the range of experiences and perspectives it brought forward.'}]},
{id:'moon',topic:'Science',art:'moon',glyph:'☾',title:'Why the Moon Changes',subtitle:'A night-sky mystery you can solve',duration:'3 min',level:'All ages',host:'The AseVerse Learning Collective',intro:'Some nights the Moon looks like a crescent. Other nights it seems round and bright. What actually changed?',body:['The Moon does not make its own light. We see sunlight reflected from its surface. As the Moon travels around Earth, we see different portions of its sunlit half.','Those changing views are called phases. New moon, crescent, quarter, gibbous, and full moon are common names used to describe them. The cycle repeats about every 29.5 days.','Earth’s shadow does not cause the ordinary phases. Earth’s shadow becomes important during a lunar eclipse, which is a different event.'],points:['Moonlight is reflected sunlight.','The Moon’s orbit changes how much of the sunlit half we see.','An eclipse is not the same thing as an ordinary Moon phase.'],quiz:[{q:'Where does the Moon’s light come from?',opts:['The Moon produces its own light','Reflected sunlight','City lights'],right:1,why:'The surface reflects light from the Sun.'},{q:'Why do Moon phases happen?',opts:['Our viewing angle changes as the Moon orbits Earth','Earth blocks the Sun every night','The Moon changes its physical shape'],right:0,why:'We see varying portions of the sunlit half as the Moon moves around Earth.'},{q:'About how long is a lunar phase cycle?',opts:['One day','One year','29.5 days'],right:2,why:'A complete cycle of phases takes about 29.5 days.'}]},
{id:'gullah',topic:'Black History',art:'gullah',glyph:'❋',title:'Gullah Geechee: Living Culture',subtitle:'Language, memory, land, and belonging',duration:'5 min',level:'Curious beginner',host:'The AseVerse Learning Collective',intro:'Along the southeastern U.S. coast, Gullah Geechee communities have preserved rich cultural traditions through language, craftsmanship, cooking, and storytelling.',body:['The Gullah Geechee people are descendants of West and Central Africans who were enslaved on coastal plantations in what is now the southeastern United States. Communities have longstanding connections to the Sea Islands and nearby coastal areas.','Distinctive language traditions, oral histories, foodways, spiritual practices, and arts are parts of this living culture. Its history also includes resilience, creativity, and efforts to protect ancestral land.','Gullah Geechee culture is not simply a chapter in the past. Contemporary community members continue to shape, protect, and share their own stories. Responsible learning starts by listening to those voices.'],points:['Gullah Geechee communities have deep ties to the southeastern coast.','Their heritage includes language, food, storytelling, and arts.','This is a living culture represented best by its own community members.'],quiz:[{q:'Where are Gullah Geechee cultural roots especially associated?',opts:['The southeastern U.S. coast','The Rocky Mountains','The Arctic'],right:0,why:'Historic communities are closely connected to the coastal southeastern United States.'},{q:'Which statement is most accurate?',opts:['The culture exists only in museums','The culture is living and continually shaped by its people','The culture has just one art form'],right:1,why:'Communities continue to practice, renew, and protect their traditions.'},{q:'What is a respectful way to learn more?',opts:['Assume every community tradition is identical','Ignore contemporary voices','Seek out Gullah Geechee-led stories and organizations'],right:2,why:'Community-led sources help preserve context, nuance, and agency.'}]},
{id:'money',topic:'Life Skills',art:'money',glyph:'✦',title:'Make a Money Map',subtitle:'Needs, wants, and goals made simple',duration:'4 min',level:'Beginner',host:'The AseVerse Learning Collective',intro:'A budget is not a punishment. It is a map that helps you decide where the money you have can go.',body:['Begin with money coming in and money going out. Expenses such as housing, food, transport, and required bills often count as needs, while optional purchases are usually wants. The categories depend on your circumstances.','A savings goal makes planning more concrete. You might save for an emergency, school supplies, or a future trip. Start with the amount you can realistically set aside, even if it is small.','Revisit the plan whenever your circumstances change. A useful budget reflects reality instead of pretending every month is identical.'],points:['Track income and spending to see the whole picture.','Separate necessities from flexible expenses when possible.','Choose achievable savings goals and adjust your plan as needed.'],quiz:[{q:'What does a simple budget help you do?',opts:['Predict every surprise','Plan how money comes in and goes out','Guarantee wealth'],right:1,why:'A budget maps income, expenses, and priorities.'},{q:'Which expense is commonly a need?',opts:['Basic groceries','Concert merchandise','A new game'],right:0,why:'Basic food is generally an essential expense.'},{q:'What makes a savings goal useful?',opts:['It must be very large','It never changes','It is specific and realistic'],right:2,why:'A specific, achievable goal is easier to plan for and revisit.'}]},
{id:'internet',topic:'Technology',art:'internet',glyph:'⌘',title:'How the Internet Travels',subtitle:'A message’s journey across the world',duration:'4 min',level:'Beginner',host:'The AseVerse Learning Collective',intro:'When you send a message, it feels instant. Behind the scenes, networks work together to move data from one device to another.',body:['Digital information is typically split into small pieces called packets. Packets travel through networks and can take different routes depending on the equipment and conditions involved.','Routers help direct packets between networks. Websites and apps often use servers to store or deliver information. Devices use agreed rules, called protocols, to communicate.','The internet is not one building or a single cloud. It is a vast network of networks, relying on physical equipment such as cables, routers, data centers, and wireless links.'],points:['Data commonly travels in packets.','Routers help direct those packets across networks.','The internet depends on physical infrastructure and shared protocols.'],quiz:[{q:'What is a packet?',opts:['A small piece of digital information','A computer screen','A kind of battery'],right:0,why:'Digital information can be broken into small packets for delivery.'},{q:'What helps direct packets across networks?',opts:['Only keyboards','Routers','Speakers'],right:1,why:'Routers help forward packets toward their destinations.'},{q:'Which description best fits the internet?',opts:['One giant computer','Only wireless signals','An interconnected network of networks'],right:2,why:'Many separate networks interconnect to provide the internet.'}]},
{id:'media',topic:'Media Literacy',art:'media',glyph:'✎',title:'Spot the Real Story',subtitle:'Better questions make smarter readers',duration:'3 min',level:'All ages',host:'The AseVerse Learning Collective',intro:'You see a dramatic headline. Everyone is sharing it. Before reposting, what would a thoughtful reader check?',body:['Start with the source. Who published the claim? Does the article identify evidence, an author, or an organization you can evaluate? An impressive-looking page is not itself proof.','Check the date and the full context. A real photo can be paired with a misleading description; an older story can be shared as though it happened today.','Look for independent, trustworthy confirmation. When a claim matters, slow down and compare reputable sources rather than relying only on a viral post.'],points:['Examine the source and evidence.','Check dates, context, and image captions.','Look for reliable confirmation before sharing.'],quiz:[{q:'A shocking post appears with no source. What is a good first step?',opts:['Forward it immediately','Check who made the claim and what evidence supports it','Believe it if it has many likes'],right:1,why:'Popularity does not establish accuracy; the source and evidence matter.'},{q:'Why check a publication date?',opts:['Old stories can be presented as new','Newer dates always mean the story is true','Dates do not matter'],right:0,why:'An old event presented as new may create a misleading impression.'},{q:'What helps verify a surprising claim?',opts:['The loudest comment','A random repost','Independent, trustworthy sources'],right:2,why:'Confirmation from reliable independent sources improves confidence.'}]}];

function restoreLearning(){try{const o=JSON.parse(localStorage.getItem(learnStore)||'{}');if(!o||typeof o!=='object')return;const ids=new Set(learningUnits.map(x=>x.id));if(Array.isArray(o.done))state.learnCompleted=new Set(o.done.filter(x=>ids.has(x)));if(Array.isArray(o.saved))state.learnSaved=new Set(o.saved.filter(x=>ids.has(x)));if(o.answers&&typeof o.answers==='object'){for(const l of learningUnits){const a=o.answers[l.id];if(a&&typeof a==='object'){state.learnAnswers[l.id]={};for(const [k,v] of Object.entries(a))if(/^\d+$/.test(k)&&Number(k)<l.quiz.length&&Number.isInteger(v)&&v>=0&&v<l.quiz[Number(k)].opts.length)state.learnAnswers[l.id][k]=v;}}}if(['warm','clear','cinematic'].includes(o.voiceStyle))state.voiceStyle=o.voiceStyle;if(typeof o.voiceURI==='string')state.voiceURI=o.voiceURI.slice(0,240);if(typeof o.voiceDemoText==='string')state.voiceDemoText=o.voiceDemoText.slice(0,480);}catch(e){}}

function lessonCover(l){return `<div class="learn-cover ${l.art}"><div class="learn-cover-symbol" aria-hidden="true">${l.glyph}</div><span class="learn-cover-label">AseVerse · Learn something new</span></div>`}
function learningCard(l){const done=state.learnCompleted.has(l.id);const answers=state.learnAnswers[l.id]||{};return `<article class="learn-card">${lessonCover(l)}<div class="learn-card-body"><span class="learn-overline">${l.topic} · ${l.duration}</span><h3>${l.title}</h3><p>${l.subtitle}</p><div class="learn-card-foot"><span class="learn-status ${done?'complete':''}">${done?'✓ Completed':Object.keys(answers).length?'◌ In progress':l.level}</span><button class="btn ${done?'btn-outline':'btn-dark'} btn-sm" data-action="open-lesson" data-id="${l.id}">${done?'Review':'Explore'} →</button></div></div></article>`}
function learningPage(){const visible=learningUnits.filter(l=>state.learnFilter==='All'||l.topic===state.learnFilter);const done=state.learnCompleted.size;const saved=state.learnSaved.size;return `<div class="learning-page"><section class="learn-hero"><div class="learn-hero-copy"><span class="eyebrow" style="color:#f6cc96">✦ THE ASEVERSE LEARNING HOUSE</span><h1>Stay curious.<br><em>Grow your world.</em></h1><p>Learn through storytelling. Explore Black history and culture, discover science, practice life skills, and turn curiosity into confidence.</p><div class="learn-hero-actions"><button class="btn btn-gold" data-action="open-lesson" data-id="${learningUnits.find(l=>!state.learnCompleted.has(l.id))?.id||'harlem'}">${done?'Continue learning':'Start exploring'} →</button><button class="btn btn-ghost" data-action="open-voice-lab">♫ Listen your way</button></div></div><div class="learn-art" aria-hidden="true"><span class="learn-orbit"></span><span class="learning-book b1">✦</span><span class="learning-book b2">☽</span><span class="learning-book b3">❋</span><span class="learn-spark">✧</span></div></section><div class="learn-metrics"><div class="learn-metric"><div class="lm-icon">✧</div><div><strong>${learningUnits.length}</strong><span>Micro-lessons</span></div></div><div class="learn-metric"><div class="lm-icon">✓</div><div><strong>${done}</strong><span>Completed</span></div></div><div class="learn-metric"><div class="lm-icon">♡</div><div><strong>${saved}</strong><span>Saved to learn</span></div></div></div><div class="section-head"><div><span class="eyebrow">CHOOSE WHAT SPARKS YOUR CURIOSITY</span><h2 class="section-title">An education shelf for every kind of mind.</h2></div><span class="small muted">Tap a lesson, read or listen, then try a mini quiz</span></div><div class="learn-chips" aria-label="Learning topic filters">${learningCategories.map(cat=>`<button class="${state.learnFilter===cat?'active':''}" data-action="learn-filter" data-id="${cat}">${cat}</button>`).join('')}</div><div class="learn-grid">${visible.map(learningCard).join('')}</div><div class="learn-promo"><div><div class="eyebrow">FOR AUTHORS, EDUCATORS & CURIOUS CREATORS</div><h3>Your knowledge has a story to tell.</h3><p>Create a lesson series, classroom-friendly story, or informative book inside the publishing desk.</p></div><button class="btn btn-dark btn-sm" data-action="pub-education">Create educational work →</button></div><div class="learn-note">✦ These are short illustrative lessons for the prototype, not a verified school curriculum. A real launch would require expert review, age-appropriate content design, and educator/community partnerships.</div></div>`}
function lessonDrawer(id){const l=learningUnits.find(x=>x.id===id);if(!l)return '<p>Lesson unavailable.</p>';const a=state.learnAnswers[id]||{};const num=Object.keys(a).length;const done=state.learnCompleted.has(id);const correct=l.quiz.reduce((sum,q,i)=>sum+(a[i]===q.right?1:0),0);return `<div class="learn-lesson-top">${lessonCover(l)}<div><div class="eyebrow">${l.topic} · ${l.duration}</div><h2>${l.title}</h2><p>${l.subtitle}<br><span class="muted">By ${l.host}</span></p></div></div><div class="voice-settings-mini"><span class="small muted">Read it, hear it, remember it.</span><div class="hstack"><button class="btn btn-outline btn-sm" data-action="learn-save" data-id="${l.id}">${state.learnSaved.has(id)?'♥ Saved':'♡ Save'}</button><button class="btn btn-outline btn-sm" data-action="learn-play" data-id="${l.id}">${state.playing?'Ⅱ Stop':'♫ Listen'}</button></div></div><div class="learn-note">${l.intro}</div>${l.body.map(p=>`<p class="learn-paragraph">${p}</p>`).join('')}<div class="learn-lesson-points"><b class="small">✦ Remember these three ideas</b><ul>${l.points.map(p=>`<li>${p}</li>`).join('')}</ul></div><div class="spread" style="margin:22px 0 12px"><div><div class="eyebrow">KNOWLEDGE CHECK</div><h3 class="serif" style="margin:5px 0;font-size:24px">See what stuck.</h3></div><span class="tag">${num}/${l.quiz.length} answered</span></div>${l.quiz.map((q,i)=>`<div class="learn-question"><b>${i+1}. ${q.q}</b>${q.opts.map((o,j)=>`<button class="learn-answer ${a[i]===j?'selected':''}" data-action="learn-answer" data-id="${l.id}" data-question="${i}" data-choice="${j}" aria-pressed="${a[i]===j}">${'ABC'[j]}. ${o}</button>`).join('')}${Number.isInteger(a[i])?`<div class="learn-feedback ${a[i]===q.right?'correct':'incorrect'}"><b>${a[i]===q.right?'✓ That’s right!':'Almost! Try another answer.'}</b> ${q.why}</div>`:''}</div>`).join('')}${done?`<div class="learn-finish"><strong>✦ Lesson completed!</strong><p>You answered ${correct} of ${l.quiz.length} correctly on this review. Your progress stays on this device.</p><button class="btn btn-dark btn-sm" data-action="nav" data-id="Learn">Browse more lessons →</button></div>`:num===l.quiz.length?`<div class="learn-finish"><strong>Ready to finish?</strong><p>You got ${correct} of ${l.quiz.length} right. Review any answers you want, then complete this lesson and claim 20 demo AseCoins (once only).</p><button class="btn btn-dark" data-action="learn-complete" data-id="${l.id}">✦ Complete lesson +20</button></div>`:`<div class="learn-note">Choose an answer for each question to unlock lesson completion.</div>`}<div class="voice-info">Narration here uses voices supplied by your device/browser. Open <button class="link-button" data-action="open-voice-lab">Narration Lab</button> to choose a speaking voice and mood; this is not a recording by a featured creator.</div>`}
function voicesAvailable(){try{return window.speechSynthesis?.getVoices().filter(v=>v.lang?.toLowerCase().startsWith('en')).sort((a,b)=>a.name.localeCompare(b.name))||[]}catch(e){return []}}
function voiceLabel(){const v=voicesAvailable().find(v=>v.voiceURI===state.voiceURI);return v?`${v.name} (${v.lang})`:'Your device’s default voice'}
function voiceLab(){const voices=voicesAvailable();return `<div class="voice-lab-hero"><span class="eyebrow" style="color:#f4d49d">✦ ASEVERSE · NARRATION LAB</span><h2>Every story deserves a voice.</h2><p>Set the tone for your sample listening experience. Real Black American authors and voice performers belong at the heart of the future AseVerse narrator community.</p></div><div class="voice-talent-section"><div class="eyebrow">THE HUMAN VOICES BEHIND THE VISION</div><h3 class="serif" style="font-size:23px;margin:6px 0 11px">A real voice makes a world feel lived in.</h3><div class="voice-talent-grid">${creators.filter(c=>['naya','eli'].includes(c.id)).map(c=>`<button class="voice-talent" data-action="creator" data-id="${c.id}">${avatar(c.id)}<span><b>${c.name}</b><small>${c.id==='naya'?'Fictional narrator · Warm, character-first delivery':'Fictional voice artist · Reflective sci-fi storytelling'}</small><em>Meet creator →</em></span></button>`).join('')}</div><p class="voice-desc">These are fictional concept profiles, not recordings. Future real voice samples would be performed and licensed by their creators.</p></div><div class="voice-control"><label for="voice-pick">Choose an available device voice</label><select id="voice-pick" data-voice-pick><option value="">Automatic / default voice</option>${voices.map(v=>`<option value="${escapeText(v.voiceURI)}" ${state.voiceURI===v.voiceURI?'selected':''}>${escapeText(v.name)} · ${escapeText(v.lang)}</option>`).join('')}</select><p class="voice-desc">${voices.length?`${voices.length} English voice${voices.length===1?'':'s'} found on this browser.`:'No English device voices were listed yet. They may load later, or playback may be unavailable in this browser.'} The list depends on the phone or computer you use.</p></div><div class="voice-control"><label>How should the narration feel?</label><div class="voice-options">${[['warm','Warm & soulful'],['clear','Clear & gentle'],['cinematic','Dramatic & intimate']].map(([key,label])=>`<button class="${state.voiceStyle===key?'active':''}" data-action="voice-style" data-id="${key}">${label}</button>`).join('')}</div><p class="voice-desc">These adjust pace and pitch, not ethnicity or accent. A true African American English performance would need a voice model made for it, or—ideally—a consenting Black voice artist recording the work.</p></div><div class="voice-control"><label for="voice-demo-text">Try it with your own line</label><textarea id="voice-demo-text" data-voice-text rows="4" maxlength="480">${escapeText(state.voiceDemoText)}</textarea><div class="hstack" style="margin-top:12px;flex-wrap:wrap"><button class="btn btn-dark" data-action="voice-test">${state.playing?'Ⅱ Stop sample':'♫ Play sample'}</button><span class="small muted">Selected: ${escapeText(voiceLabel())}</span></div></div><div class="voice-info"><b>For the real AseVerse:</b> A “Black American narrator” would mean hiring or licensing performances by real Black American voice talent—not automatically changing someone's pitch or imitating a stereotype. Later, readers could choose real narrator profiles, hear consented audio samples, and support the people behind the voices. This prototype currently uses device speech only.</div>`}
function speakDemo(text){if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return false;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const chosen=voicesAvailable().find(v=>v.voiceURI===state.voiceURI);if(chosen)u.voice=chosen;const style={warm:[.89,.98],clear:[1.00,1.05],cinematic:[.82,.88]}[state.voiceStyle]||[.9,1];u.rate=Math.max(.55,Math.min(2,style[0]*(parseFloat(state.speed)||1)));u.pitch=style[1];u.volume=1;u.onend=()=>{state.playing=false;if(state.panel)render(true)};u.onerror=()=>{state.playing=false;if(state.panel)render(true)};window.speechSynthesis.speak(u);state.playing=true;return true}catch(e){state.playing=false;return false}}

function restorePub(){try{const obj=JSON.parse(localStorage.getItem(pubStore)||'{}');if(!obj||typeof obj!=='object')return; if(Array.isArray(obj.projects))state.pubProjects=obj.projects.filter(p=>p&&typeof p.title==='string'&&Array.isArray(p.chapters)).slice(0,20).map(p=>({...blankPub(),...p,title:String(p.title).slice(0,80),chapters:p.chapters.slice(0,30).map(c=>({title:String(c.title||'').slice(0,90),body:String(c.body||'').slice(0,15000)}))}));if(obj.working&&typeof obj.working==='object'&&Array.isArray(obj.working.chapters))state.pubWorking={...blankPub(),...obj.working};if(typeof obj.index==='number'&&obj.index>=0&&obj.index<state.pubProjects.length)state.pubIndex=obj.index;if(Number.isInteger(obj.step)&&obj.step>=0&&obj.step<=3)state.pubStep=obj.step;}catch(e){}}

function pubValidate(step){const p=state.pubWorking;if(!p)return false;if(step===0){if(!p.title.trim()||!p.description.trim()){toast('Add a title and story description first ✦');return false;}}if(step===1&&!p.chapters.length){toast('Add at least one chapter to continue ✦');return false;}return true}
function pubProjectCard(p,i){return `<article class="pub-project-card"><img src="${pubCoverSrc(p)}" alt="Cover artwork for ${escapeText(p.title||'Untitled story')}" /><div class="pub-project-body"><span class="pub-status ${p.localStatus==='Demo published'?'live':''}">${p.localStatus==='Demo published'?'✦ Published in your demo':'✎ Private draft'}</span><h3>${escapeText(p.title||'Untitled story')}</h3><p>${escapeText(p.description||'A new story is finding its voice.')}</p><span class="tiny muted">${escapeText(p.genre)} · ${p.chapters.length} chapter${p.chapters.length===1?'':'s'} · ${pubWordCount(p)} words</span><div class="pub-project-actions"><button class="btn btn-dark btn-sm" data-shared-feature data-action="publish-opening" data-id="${i}">Publish Chapter 1 online</button><button class="btn btn-outline btn-sm" data-action="pub-edit" data-id="${i}">${icon('edit',13)} Edit</button><button class="btn btn-soft btn-sm" data-action="pub-view" data-id="${i}">${icon('book',13)} Reader preview</button><button class="btn btn-outline btn-sm" data-action="pub-delete" data-id="${i}" title="Delete this local demo project">${icon('close',13)} Remove</button></div></div></article>`}
function publishDesk(){return `<div class="pub-hero"><div><div class="eyebrow" style="color:#f6d5a5">THE AUTHORS' ATELIER · CREATOR STUDIO</div><h2>Your imagination deserves <em>the spotlight.</em></h2><p>Give your work a cover, a heartbeat, and a place in the universe. Build a beautiful reader-facing story page, chapter by chapter.</p><button class="btn btn-gold" data-action="pub-new">${icon('plus',14)} Create a book</button><button class="btn btn-ghost btn-sm" style="margin-left:7px" data-action="pub-education">✦ Create a lesson</button></div><div class="pub-hero-art"><img src="${generatedArt.covers.velvet}" alt="Cinematic book cover"/><img src="${generatedArt.covers.night}" alt="Fantasy book cover"/></div></div><div class="section-head"><div><div class="eyebrow">FROM FIRST SPARK TO FIRST CHAPTER</div><h2 class="section-title">Four little steps to your next world.</h2></div></div><div class="pub-step-grid">${[['01','Story identity','Title, synopsis, genre, cover'],['02','Your chapters','Write, edit, and reorder'],['03','Choose access','Reading format & unlock model'],['04','See the magic','Preview and demo-publish']].map(([n,t,d])=>`<div class="pub-step-tile"><span>${n}</span><b>${t}</b><p>${d}</p></div>`).join('')}</div>${state.pubWorking?`<div class="pub-note" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>✧ You have an unfinished publishing session waiting for you.</span><button class="btn btn-dark btn-sm" data-action="pub-resume">Continue editing →</button></div>`:''}<div class="section-head"><div><div class="eyebrow">YOUR PROJECT SHELF</div><h2 class="section-title">Works taking shape (${state.pubProjects.length})</h2></div><button class="btn btn-dark btn-sm" data-action="pub-new">${icon('plus',13)} New book</button></div>${state.pubProjects.length?state.pubProjects.map(pubProjectCard).join(''):`<div class="pub-empty"><div style="font:38px Georgia,serif;color:var(--gold)">✒</div><h3>Your first book starts here.</h3><p>Build your first story from scratch, or open a sample setup and make it yours.</p><div class="hstack" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-dark btn-sm" data-action="pub-new">Start blank</button><button class="btn btn-outline btn-sm" data-action="pub-sample">Try sample story setup</button></div></div>`}<div class="pub-note">✧ This is a creative prototype. “Publish” creates a reader-facing preview on this device only—nothing is uploaded, sold, or shared publicly.</div>`}
function pubIdentityForm(p){return `<div class="pub-field-grid"><label class="pub-label">Book title *<input class="textbox" name="pubTitle" maxlength="80" placeholder="The world you're about to create..." value="${escapeText(p.title)}"></label><label class="pub-label">A little hook / tagline<input class="textbox" name="pubSubtitle" maxlength="100" placeholder="One promise. Two impossible choices." value="${escapeText(p.subtitle)}"></label><label class="pub-label">Genre<select class="textbox" name="pubGenre">${pubGenres.map(g=>`<option ${p.genre===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="pub-label">Age rating<select class="textbox" name="pubAge">${['Everyone','13+','16+','18+'].map(g=>`<option ${p.age===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="pub-label">Story status<select class="textbox" name="pubStoryStatus">${['Ongoing','Complete','Coming soon'].map(g=>`<option ${p.storyStatus===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="pub-label">Language<input class="textbox" name="pubLanguage" maxlength="40" value="${escapeText(p.language)}" placeholder="English"></label></div>${p.genre==='Educational'?`<div class="pub-learning-note"><b>✦ Educational creator mode</b><div>Share the learning goal and design an experience readers can understand, listen to, and discuss. Review accuracy and credit sources before publishing for real.</div></div><label class="pub-label">What will readers learn?<input class="textbox" name="pubLearningObjective" maxlength="160" placeholder="By the end, readers will understand..." value="${escapeText(p.learningObjective||'')}"></label>`:''}<label class="pub-label">The back-cover description *<textarea class="textbox textarea" name="pubDescription" maxlength="1200" rows="4" placeholder="What happens in your story? Who will readers fall for, fear, or root for?">${escapeText(p.description)}</textarea></label><div class="pub-field-grid"><label class="pub-label">Tags <small>Comma-separated, e.g. slow burn, magic, found family</small><input class="textbox" name="pubTags" maxlength="140" value="${escapeText(p.tags)}"></label><label class="pub-label">Content notes <small>Optional reader advisory</small><input class="textbox" name="pubContentNotes" maxlength="160" value="${escapeText(p.contentNotes)}" placeholder="Sensitive themes, etc."></label></div><div class="section-head"><h3 class="section-title">Give your story a face.</h3><span class="tiny muted">Original demo artwork</span></div><div class="pub-cover-grid">${pubCovers.map(id=>`<button class="pub-cover-choice ${p.cover===id&&!p.customCover?'selected':''}" data-action="pub-cover" data-id="${id}" aria-label="Choose cover ${id}" aria-pressed="${p.cover===id&&!p.customCover}"><img src="${generatedArt.covers[id]}" alt="${id} style book illustration"/><span>${id==='night'?'Starlit':id==='velvet'?'Velvet':id==='echoes'?'Futurist':id==='lantern'?'Mystery':id==='letters'?'Sunlit':'Rhythm'}</span></button>`).join('')}</div><div class="pub-upload" role="group" aria-label="Custom book cover"><div class="pub-upload-heading">Or upload your own cover <span aria-hidden="true">✦</span></div><div class="pub-upload-drop">${p.customCover?`<div class="pub-upload-preview"><img class="pub-upload-preview-image" src="${p.customCover}" alt="Your uploaded cover preview"/><div class="pub-upload-preview-body"><strong>Your cover is ready ✦</strong><span>Preview your image or make a change.</span><div class="pub-upload-preview-actions"><button type="button" class="pub-upload-replace" data-action="pub-open-cover">Replace Cover</button><button type="button" class="pub-upload-remove" data-action="pub-clear-cover">Remove Cover</button></div></div></div>`:`<button type="button" class="pub-upload-choose" data-action="pub-open-cover" aria-describedby="pub-upload-formats pub-upload-hint"><span class="pub-upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/></svg></span><span class="pub-upload-main">Upload Your Cover</span><span class="pub-upload-formats" id="pub-upload-formats">JPG, PNG, or WebP</span></button>`}<input class="pub-upload-input" type="file" id="pub-cover-upload" accept="image/png,image/jpeg,image/webp" tabindex="-1" aria-label="Choose your own book cover" /></div><p class="pub-upload-hint" id="pub-upload-hint">Resized privately on your device · 9 MB maximum · No server upload</p></div>`}
function pubChapterForm(p){return `<p class="small muted">Craft your story one chapter at a time. This writing desk saves each chapter to your local project.</p>${p.chapters.length?p.chapters.map((c,i)=>`<div class="pub-chapter-card"><span class="pub-chapter-number">${i+1}</span><div class="pub-chapter-copy"><b>${escapeText(c.title||'Untitled chapter')}</b><small>${String(c.body||'').trim().split(/\s+/).filter(Boolean).length} words</small></div><div class="pub-mini-actions"><button data-action="pub-chapter-up" data-id="${i}" aria-label="Move chapter ${i+1} up" ${i===0?'disabled':''}>↑</button><button data-action="pub-chapter-down" data-id="${i}" aria-label="Move chapter ${i+1} down" ${i===p.chapters.length-1?'disabled':''}>↓</button><button data-action="pub-chapter-edit" data-id="${i}">Edit</button><button data-action="pub-chapter-remove" data-id="${i}">×</button></div></div>`).join(''):`<div class="pub-note">✒ The first chapter is still waiting to be written. Start with a scene, a letter, or a single brave sentence.</div>`}<form id="pub-chapter-form" class="pub-chapter-compose"><h3>${state.pubChapterEdit<0?'Add the next chapter':'Edit this chapter'}</h3><label class="pub-label">Chapter title<input class="textbox" required maxlength="90" name="chapterTitle" placeholder="Chapter One: The Beginning" value="${escapeText(state.pubChapterTitle)}"></label><label class="pub-label">Chapter text<textarea class="textbox textarea" rows="8" maxlength="15000" required name="chapterBody" placeholder="Your story starts here...">${escapeText(state.pubChapterBody)}</textarea></label><div class="spread"><span class="tiny muted">${state.pubChapterEdit<0?'You can add more chapters anytime.':'Your edits will replace this chapter.'}</span><div class="hstack"><button type="submit" class="btn btn-dark btn-sm">${icon('check',13)} ${state.pubChapterEdit<0?'Add chapter':'Save chapter'}</button>${state.pubChapterEdit>=0?'<button class="btn btn-outline btn-sm" type="button" data-action="pub-chapter-cancel">Cancel edit</button>':''}</div></div></form><div class="pub-note">${p.chapters.length} chapter${p.chapters.length===1?'':'s'} · ${pubWordCount(p)} words · No external uploads are sent.</div>`}
function pubAccessForm(p){return `<h3 class="section-title" style="margin-bottom:10px">How can readers experience it?</h3><div class="pub-choices">${[['Text','Read chapters on-screen'],['Text + audio later','Start with chapters; add narration later'],['Audio only (concept)','Narration-first concept, no live audio upload']].map(([label,desc])=>`<label class="pub-choice ${p.format===label?'selected':''}"><input type="radio" name="pubFormat" value="${escapeText(label)}" ${p.format===label?'checked':''}><span><b>${label}</b><small>${desc}</small></span></label>`).join('')}</div><h3 class="section-title" style="margin:25px 0 10px">Choose your story's access model.</h3><div class="pub-choices">${pubAccess.map(([label,desc])=>`<label class="pub-choice ${p.access===label?'selected':''}"><input type="radio" name="pubAccess" value="${escapeText(label)}" ${p.access===label?'checked':''}><span><b>${label}</b><small>${desc}</small></span></label>`).join('')}</div><div class="pub-note">No real billing, paywalls, advertising, AseCoin deduction, narrator uploads, or eligibility enforcement are connected here. These selections are visual publishing settings for the demo.</div>`}
function pubPreviewCard(p){return `<div class="pub-preview"><div class="pub-preview-hero"><img src="${pubCoverSrc(p)}" alt="${escapeText(p.title||'Story cover')}"/><div><span class="eyebrow" style="color:#f2d3a5">✦ AN ASEVERSE ORIGINAL · READER VIEW</span><h2>${escapeText(p.title||'Your Untitled Story')}</h2><p>${escapeText(p.subtitle||p.description||'A new world to discover.').slice(0,260)}</p><span class="pub-tag">${escapeText(p.genre)}</span><span class="pub-tag">${escapeText(p.age)}</span><span class="pub-tag">${escapeText(p.storyStatus)}</span><span class="pub-tag">${escapeText(p.access)}</span></div></div><div class="pub-preview-content"><div class="eyebrow">ABOUT THIS STORY</div><p style="font-size:13px;line-height:1.8">${escapeText(p.description||'Add a story description to set the scene.')}</p>${p.genre==='Educational'&&p.learningObjective?`<div class="pub-note">✦ Learning goal: ${escapeText(p.learningObjective)}</div>`:''}<p class="small muted">by ${escapeText(state.userName)} · ${p.chapters.length} chapter${p.chapters.length===1?'':'s'} · ${escapeText(p.format)}</p>${p.tags?`<p class="small muted"># ${escapeText(p.tags.split(',').map(x=>x.trim()).filter(Boolean).join('  # '))}</p>`:''}${p.contentNotes?`<div class="pub-note">Content note: ${escapeText(p.contentNotes)}</div>`:''}<h3>Open your book.</h3>${p.chapters.length?`<h4 style="margin-bottom:7px">${escapeText(p.chapters[0].title)}</h4><div class="chapter-excerpt">${escapeText(p.chapters[0].body).slice(0,1800)}</div>${p.chapters.length>1?`<div class="pub-note">Next up: ${p.chapters.slice(1,4).map(c=>escapeText(c.title)).join(' · ')}${p.chapters.length>4?' · and more':''}</div>`:''}`:'<div class="pub-note">Add a chapter to see your first pages here.</div>'}<div class="pub-note">This is a reader-facing visual preview, not a public listing. All books, payment options, and chapter access remain demo-only.</div></div></div>`}
function pubWizard(){const p=state.pubWorking||blankPub(),step=state.pubStep;const headings=['Give your story an identity.','Write the pages they’ll remember.','Let readers know what to expect.','See your story come to life.'];const subtitles=['Make the first impression feel like your book.','Build chapters and put them in the right order.','Choose how the experience could be offered.','Check the details before saving or demo-publishing.'];return `<div class="pub-wizard-head"><div><span class="eyebrow" style="color:#f2cfa3">AUTHORS' ATELIER · STEP ${step+1} OF 4</span><h2>${headings[step]}</h2><p>${subtitles[step]}</p></div><span class="pub-stepcount">0${step+1} / 04</span></div><div class="pub-progress" aria-label="Publishing progress">${[0,1,2,3].map(n=>`<span class="${n<=step?'active':''}"></span>`).join('')}</div>${step===0?pubIdentityForm(p):step===1?pubChapterForm(p):step===2?pubAccessForm(p):pubPreviewCard(p)}<div class="pub-actions"><button class="btn btn-outline btn-sm" data-action="pub-save">${icon('bookmark',13)} Save locally</button><div class="hstack">${step===3?'<button data-shared-feature class="btn btn-gold btn-sm" data-action="publish-opening">Review public Chapter 1</button>':''}${step>0?`<button class="btn btn-outline btn-sm" data-action="pub-back">← Back</button>`:''}${step<3?`<button class="btn btn-dark btn-sm" data-action="pub-next">Continue ${icon('chevron',13)}</button>`:`<button class="btn btn-dark btn-sm" data-action="pub-publish">${icon('spark',13)} Publish to my demo shelf</button>`}</div></div><p class="small-note">Your project is saved only in this browser. Demo publishing does not make your story public.</p>`}
function startPub(index=null,sample=false){state.pubIndex=index;state.pubWorking=index!==null&&state.pubProjects[index]?JSON.parse(JSON.stringify(state.pubProjects[index])):blankPub();if(sample){Object.assign(state.pubWorking,{title:'The Garden of Forgotten Names',subtitle:'Some stories bloom only after midnight.',description:'When a young archivist inherits a garden that remembers everyone who ever entered it, she discovers a family secret hidden between the roots — and an impossible promise made generations before.',genre:'Fantasy',tags:'ancestral magic, found family, hope',cover:'lantern',age:'13+',chapters:[{title:'Chapter One · The Gate',body:'The key arrived in a box of letters, wrapped in ribbon the color of rain. Amari held it to the light. Along the copper edge, tiny letters curved into a name she had never been taught to say. Beyond her grandmother’s house, the garden gate opened on its own.'}]})}state.pubStep=0;state.pubChapterTitle='';state.pubChapterBody='';state.pubChapterEdit=-1;savePub();openPanel('pub-wizard')}
function prepareOpening(index){
 const editing=index===undefined;
 const project=editing?state.pubWorking:state.pubProjects[Number(index)];
 const first=project?.chapters?.[0];
 if(!project?.title?.trim()||!first?.body?.trim()){toast('Add a title and your opening chapter first.');return;}
 project.publicStoryId ||= crypto.randomUUID();
 if(editing){
   const local=JSON.parse(JSON.stringify(project));
   if(state.pubIndex===null){state.pubIndex=state.pubProjects.length;state.pubProjects.push(local);}
   else state.pubProjects[state.pubIndex]=local;
 }
 const preview={id:project.publicStoryId,title:project.title,summary:project.description||'',byline:state.userName,genre:project.genre||'',age_rating:project.age||'',content_notes:project.contentNotes||'',cover:pubCoverSrc(project),chapter_title:first.title||'Chapter 1',chapter_body:first.body};
 try{
   localStorage.setItem(pubStore,JSON.stringify({projects:state.pubProjects,working:state.pubWorking,index:state.pubIndex,step:state.pubStep}));
   sessionStorage.setItem('aseverse-public-preview',JSON.stringify(preview));
 }catch{toast('This browser could not save the draft. Free some browser storage and try again.');return;}
 location.assign('reading-room#publish');
}
if(location.protocol==='https:'||location.hostname==='localhost'){
 fetch('/api/reader-config').then(r=>r.ok?r.json():null).then(c=>{if(c?.url&&c?.key)document.documentElement.classList.add('shared-ready')}).catch(()=>{});
}
function commitPub(publish=false){const p=state.pubWorking;if(!p)return;if(publish&&!pubValidate(0))return;if(publish&&!pubValidate(1))return;const wasPublished=state.pubIndex!==null&&state.pubProjects[state.pubIndex]?.localStatus==='Demo published';p.localStatus=publish?'Demo published':wasPublished?'Demo published':'Draft';p.updated=Date.now();const item=JSON.parse(JSON.stringify(p));if(state.pubIndex!==null&&state.pubProjects[state.pubIndex])state.pubProjects[state.pubIndex]=item;else{state.pubIndex=state.pubProjects.length;state.pubProjects.push(item)}state.pubWorking=null;savePub();state.panel=null;state.page='Studio';state.studioTab='Publishing Desk';render(true);toast(publish?'✨ Your book is published to this demo shelf!':'Your story has been saved on this device ✦')}
function publishedShelf(){const arr=state.pubProjects.map((p,i)=>({p,i})).filter(x=>x.p.localStatus==='Demo published');if(!arr.length)return'';return `<section class="pub-reader-shelf"><div class="section-head"><div><div class="eyebrow">ONLY VISIBLE IN YOUR BROWSER</div><h2 class="section-title">From your publishing desk ✦</h2></div><button class="link-button" data-action="nav" data-id="Studio">Studio →</button></div>${arr.map(x=>pubProjectCard(x.p,x.i)).join('')}</section>`}

function sharedLink(route,label){return '<a data-shared-feature class="btn btn-outline btn-sm" href="reading-room#'+route+'">'+label+'</a>'}
function discover(){return sharedLink('discover','Discover published stories')+publishedShelf()+discoverOriginal()}
function studio(){const completed=state.studioChecklist.filter(Boolean).length;const totalWords=state.published.reduce((n,d)=>n+(d.body.trim()?d.body.trim().split(/\s+/).length:0),0);
return `<section class="studio-hero" ${state.studioTab==='Publishing Desk'?'style="display:none"':''}><div><div class="section-kicker" style="color:#e9bd88">✦ YOUR CREATIVE SANCTUARY</div><h1>Make something that<br>stays with someone.</h1><p>One sentence, one voice, one world at a time. This is your space to experiment, shape ideas, and grow.</p><div class="hstack" style="flex-wrap:wrap"><button class="btn btn-gold" data-action="pub-new">${icon('plus',15)} Publish a story</button><button class="btn btn-ghost" data-action="draft">Quick writing draft</button></div></div><div style="font:72px Georgia,serif;color:#f0cca6aa">✒</div></section>
<nav class="studio-tabs" aria-label="Creator Studio sections">${['Overview','My Stories','Publishing Desk','Voice Collabs','Insights'].map(t=>`<button class="${state.studioTab===t?'active':''}" data-action="studio-tab" data-id="${t}">${t}</button>`).join('')}</nav>
${state.studioTab==='Overview'?`
<div class="studio-widgets"><div class="studio-tile"><div class="section-kicker">THE IDEA SPARK</div><h3>Every story begins with a what if.</h3><div class="mini-prompt"><span class="eyebrow" style="color:inherit">TODAY'S IMAGINATION PROMPT</span><blockquote>“${prompts[state.promptIndex]}”</blockquote><div class="hstack"><button class="btn btn-dark btn-sm" data-action="use-prompt">Write this idea →</button><button class="btn btn-outline btn-sm" style="color:#4c2a42;background:#fff9" data-action="shuffle-prompt">↻ New prompt</button></div></div></div>
<div class="studio-tile"><div class="section-kicker">YOUR CREATIVE RHYTHM</div><h3>Small steps make worlds.</h3><p>Build your routine one little milestone at a time.</p><div class="checklist">${['Dream up a story idea','Write the opening scene','Explore a voice collaboration'].map((s,i)=>`<label><input type="checkbox" data-checklist="${i}" ${state.studioChecklist[i]?'checked':''}><span>${s}</span></label>`).join('')}</div><div class="progress-track"><span style="width:${completed*100/3}%"></span></div><span class="tiny muted">${completed} of 3 creator milestones checked</span></div></div>
<div class="section-head" style="margin-top:24px"><div><div class="eyebrow">YOUR WRITING DESK</div><h2 class="section-title">Stories taking shape</h2></div><button class="link-button" data-action="studio-tab" data-id="My Stories">See my drafts →</button></div>
${state.published.length?state.published.slice(0,2).map(draftItem).join(''):`<div class="studio-tile" style="display:flex;align-items:center;gap:18px"><span style="font:40px Georgia,serif;color:var(--gold)">✦</span><div style="flex:1"><b style="font-size:13px">Your first draft is ready to be born.</b><p style="margin:5px 0 0">Start with a title and a few lines. The rest can come later.</p></div><button class="btn btn-dark btn-sm" data-action="draft">Write now</button></div>`}
<div class="studio-widgets" style="margin-top:15px"><div class="studio-tile"><div class="section-kicker">CREATORS FINDING CREATORS</div><h3>A story becomes more with a voice.</h3><p>Explore the sample narrator profiles and imagine your first collaboration.</p><button class="btn btn-outline btn-sm" data-action="studio-tab" data-id="Voice Collabs">${icon('headphones',14)} Meet narrators</button></div><div class="studio-tile"><div class="section-kicker">YOUR NEXT CHAPTER</div><h3>${state.published.length} draft${state.published.length===1?'':'s'} · ${totalWords.toLocaleString()} words</h3><p>Real progress isn't just the numbers. It's that you showed up to create something.</p><button class="btn btn-outline btn-sm" data-action="studio-tab" data-id="My Stories">Open my writing desk →</button></div></div>`:
state.studioTab==='My Stories'?`<div class="section-head"><div><div class="eyebrow">PRIVATE DEMO WRITING DESK</div><h2 class="section-title">Your unfinished magic.</h2></div><button class="btn btn-dark btn-sm" data-action="draft">${icon('plus',13)} New draft</button></div><p class="small muted" style="margin-bottom:17px">${state.published.length} drafts · ${totalWords.toLocaleString()} words total. Create a draft, close the app, and reopen it in this browser to see it here.</p>${state.published.length?state.published.map(draftItem).join(''):`<div class="shelf-empty"><span class="spark">✒</span><h3>Nothing on the page yet?</h3><p>One line is more than enough to begin.</p><button class="btn btn-dark btn-sm" data-action="draft">Write my first lines</button></div>`}<div class="note">Your drafts stay on this device in local browser storage. This demo cannot publish stories to a public platform.</div>`:

${members?`<form id="community-compose" class="community-compose"><div class="hstack">${avatar('me')}<div><strong>${escapeText(state.userName)}</strong><div class="tiny muted">What did this story make you feel?</div></div></div><textarea name="postText" class="textbox textarea" maxlength="360" rows="3" required placeholder="A theory, a favorite moment, a question for the room…"></textarea><div class="spread" style="gap:8px;flex-wrap:wrap;align-items:center"><label class="tiny muted"><input type="checkbox" name="spoiler"> Mark as spoiler</label><button class="btn btn-dark btn-sm" type="submit">${icon('message',13)} Share with club</button></div></form>`:`<div class="club-lock"><span>✍</span><div><b>There's a seat saved for you.</b><p>Join this sample club to share your own post. Nothing is published online.</p></div><button class="btn btn-gold btn-sm" data-action="join-club" data-id="${c.id}">Join</button></div>`}

${all.length?all.map(p=>`<article class="discussion-post"><div class="hstack">${avatar(p.avatar==='zuri'||p.avatar==='naya'?'zuri'===p.avatar?'zuri':'naya':'me')}<div class="post-info"><b>${escapeText(p.id.startsWith('seed')?p.author:state.userName)}</b><small>${p.id.startsWith('seed')?p.time:'Your local post'} · ${escapeText(p.story||c.name)}</small></div>${p.spoiler?'<span class="spoiler-label">SPOILER</span>':''}</div><div class="post-text ${p.spoiler&&!state.spoilersShown.has(p.id)?'spoiler-blurred':''}">${p.spoiler&&!state.spoilersShown.has(p.id)?`<span>Hidden to protect the plot ✦</span><button data-action="show-spoiler" data-id="${p.id}" class="btn btn-outline btn-sm">Reveal post</button>`:`<p>${escapeText(p.text)}</p>`}</div><div class="post-actions"><button class="${state.postLikes.has(p.id)?'hearted':''}" data-action="like-post" data-id="${p.id}" aria-pressed="${state.postLikes.has(p.id)}">${icon('heart',15)} ${p.likes+(state.postLikes.has(p.id)?1:0)} love this</button><button data-action="reader" data-id="${c.cover}" data-mode="Read">${icon('book',15)} Explore story</button></div></article>`).join(''):'<div class="note">Start this conversation with the first post ✦</div>'}
</div><aside class="community-side"><div class="side-note"><div class="eyebrow" style="color:#e4b983">A NOTE FROM THE UNIVERSE</div><h3 class="serif">Your perspective is part of the story.</h3><p>No gatekeeping. No perfect takes required. Be curious, be kind, and let other readers love what they love.</p><div class="side-avatars">${avatar('zuri')}${avatar('naya')}${avatar('eli')}</div></div><div class="panel"><div class="eyebrow">READER REWARDS</div><h3 class="serif">A little magic for showing up.</h3><div class="coin-mini">✦ ${state.coins} <span>AseCoins · Demo</span></div><button class="btn btn-outline btn-sm" data-action="wallet">Open my rewards →</button></div><div class="panel"><div class="eyebrow">MEET THE VOICES</div><h3 class="serif">Stories deserve to be heard.</h3><p class="small muted">A look inside the narrator collaboration room.</p><button class="btn btn-dark btn-sm" data-action="collab">Find voice artists</button></div></aside></div>`}
function readerHtml(s){const progress=Math.min(100,Math.max(0,Number(state.readingProgress[s.id])||0));const theme=state.readTheme;const active=state.highlights[s.id]||[];return `<div class="spread"><div><div class="eyebrow">YOUR DUAL EXPERIENCE</div><h2 class="serif" style="margin:5px 0">${s.title}</h2><div class="small muted">Chapter 1 · Fictional sample</div></div><button data-action="story" data-id="${s.id}" class="btn btn-outline btn-sm">${icon('back',13)} Details</button></div>
<nav class="pill-row" aria-label="Reading and listening modes">${['Read','Listen','Read + Listen'].map(m=>`<button class="pill ${state.mode===m?'active':''}" data-action="mode" data-id="${m}">${icon(m==='Read'?'book':m==='Listen'?'headphones':'spark',14)} ${m}</button>`).join('')}</nav>
${state.mode!=='Listen'?`<div class="reader-settings"><span class="small muted">Make it comfortable</span><div class="hstack"><button class="btn btn-outline btn-sm" data-action="font-down" aria-label="Smaller font">A−</button><button class="btn btn-outline btn-sm" data-action="font-up" aria-label="Larger font">A+</button></div></div><div class="reading-moods">${[['parchment','☼ Parchment'],['moonlight','☾ Moonlight'],['ink','✦ Ink']].map(([k,v])=>`<button class="${theme===k?'selected':''}" data-action="reading-theme" data-id="${k}">${v}</button>`).join('')}</div><div class="reader-page reader-${theme}" style="font-size:${state.fontSize}px"><div class="eyebrow" style="text-align:center">CHAPTER ONE</div><h3 class="serif" style="text-align:center;font-size:1.5em;line-height:1.2">The Beginning</h3><button class="reader-paragraph ${active.includes(0)?'marked':''}" data-action="highlight" data-id="0" title="Highlight this paragraph" aria-pressed="${active.includes(0)}">${escapeText(s.chapter)}</button><button class="reader-paragraph ${active.includes(1)?'marked':''}" data-action="highlight" data-id="1" title="Highlight this paragraph" aria-pressed="${active.includes(1)}">And somewhere, at the edge of a world she had not yet explored, the next chapter was already calling.</button><div class="reading-hint">${icon('spark',12)} Tap a paragraph to highlight it. Highlights stay on this device.</div></div>`:''}
${state.mode!=='Read'?`<div class="player-big" style="margin-top:14px">${cover(s)}<strong>${s.title}</strong><div class="small muted" style="margin:5px">Synthetic device voice · Not a human narrator recording</div><button class="btn btn-outline btn-sm" style="margin:5px" data-action="open-voice-lab">♫ Narration settings</button><div class="player-rail"><span style="width:${state.playing?56:progress}%"></span></div><div class="hstack" style="justify-content:center;gap:9px;margin-top:9px"><button class="btn btn-outline btn-sm" data-action="speed">${state.speed}</button><button class="btn btn-dark" data-action="play">${icon(state.playing?'pause':'play',17)} ${state.playing?'Pause':'Play preview'}</button><button class="btn btn-outline btn-sm" data-action="skip">${icon('skip',17)}</button></div></div>`:''}

>`:`<div class="panel"><div class="hstack">${icon('award',21)} <strong>${c.badge}</strong></div><p class="small muted">A creator recognition and progression system.</p><div class="tier-grid">${tiers.map(badge).join('')}</div></div>`}`}

if(e.target.id==='casting-form'){e.preventDefault();const fd=new FormData(e.target);const narrator=String(fd.get('narrator')||'');const work=String(fd.get('work')||'').trim().slice(0,75);const note=String(fd.get('note')||'').trim().slice(0,300);if(!creators.some(c=>c.id===narrator&&c.id!=='zuri')||!work||!note){toast('Add a project, narrator, and note');return;}state.castNarrator=narrator;state.castingRequests.unshift({narrator,work,note});state.castingRequests=state.castingRequests.slice(0,12);saveCommunity();toast('Sample invitation saved — not sent ✦');return;}
if(e.target.id==='profile-form'){e.preventDefault();const fd=new FormData(e.target);const name=String(fd.get('userName')||'').trim();const handle=String(fd.get('userHandle')||'').trim().replace(/^@/,'');if(!name||!/^[A-Za-z0-9_]{2,24}$/.test(handle)){toast('Add a name and a valid username');return}state.userName=name.slice(0,32);state.userHandle=handle;state.userBio=String(fd.get('userBio')||'').trim().slice(0,180);state.favoriteGenre=String(fd.get('favoriteGenre')||'Fantasy');state.userAvatar=state.profileDraft?.userAvatar||'me';state.userAccent=state.profileDraft?.userAccent||'plum';state.profileDraft=null;state.panel=null;state.page='Profile';persist();toast('Your universe feels more like you ✦');return}
if(e.target.id==='draft-form'){e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get('draftTitle')||'').trim(),body=String(fd.get('draftBody')||'').trim();if(!title||!body){toast('Add a title and opening lines first');return}const entry={title:title.slice(0,70),body:body.slice(0,2000)};if(state.editDraft!==null&&state.published[state.editDraft])state.published[state.editDraft]=entry;else state.published.unshift(entry);state.editDraft=null;state.draftTitle='';state.draftBody='';state.panel=null;state.page='Studio';state.studioTab='My Stories';persist();toast('Your words are saved in your creative sanctuary ✦');return}});

app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}if(e.key==='Escape'&&(state.panel||state.menu||state.searchOpen)){window.speechSynthesis?.cancel();state.playing=false;state.panel=null;state.menu=false;state.searchOpen=false;render(true)}});
if('speechSynthesis' in window){window.speechSynthesis.addEventListener?.('voiceschanged',()=>{if(state.panel==='voice-lab')render(true)})}render();
})();
</script></body></html>
